<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- installable comme une appli (« Ajouter à l'écran d'accueil ») : icône BM, plein écran -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="B. Morel" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Benjamin Morel | Étudiant & développeur</title>
    <meta
      name="description"
      content="Benjamin Morel, étudiant de 20 ans à l'Université Paris Cité. Mes projets, mon parcours et ce qui m'intéresse."
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://benjaminmorel1.github.io/sitepro/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Benjamin Morel | Étudiant & développeur" />
    <meta
      property="og:description"
      content="Benjamin Morel, étudiant de 20 ans à l'Université Paris Cité. Mes projets, mon parcours et ce qui m'intéresse."
    />
    <meta property="og:url" content="https://benjaminmorel1.github.io/sitepro/" />
    <meta property="og:site_name" content="Benjamin Morel" />
    <meta property="og:image" content="https://benjaminmorel1.github.io/sitepro/og-image.jpg" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Benjamin Morel | Étudiant & développeur" />
    <meta
      name="twitter:description"
      content="Benjamin Morel, étudiant de 20 ans à l'Université Paris Cité. Mes projets, mon parcours et ce qui m'intéresse."
    />
    <meta name="twitter:image" content="https://benjaminmorel1.github.io/sitepro/og-image.jpg" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Benjamin Morel",
        "url": "https://benjaminmorel1.github.io/sitepro/",
        "description": "Étudiant de 20 ans à l'Université Paris Cité."
      }
    </script>

    <!-- Statistiques de visite (GoatCounter, sans cookies) : le comptage est fait dans src/analytics.ts -->
    <script
      data-goatcounter="https://benjaminmorelsitepro.goatcounter.com/count"
      data-goatcounter-settings='{"no_onload": true}'
      async
      src="//gc.zgo.at/count.js"
    ></script>
    <!-- thème sombre posé avant l'affichage s'il est actif sur l'appareil (voir src/theme.ts) -->
    <script>
      try {
        if (window.matchMedia("(prefers-color-scheme: dark)").matches) document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
